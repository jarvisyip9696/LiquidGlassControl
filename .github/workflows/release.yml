name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Verify translation coverage
        shell: pwsh
        run: ./verify-localization.ps1
      - name: Check version
        shell: pwsh
        run: |
          $script = Get-Content src/app_version.h -Raw
          $version = [regex]::Match($script, '(?m)^#define LG_VERSION "([^"]+)"').Groups[1].Value
          if (-not $version -or $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match app_version.h version' }
      - name: Prepare Windows framework headers
        shell: pwsh
        run: ./prepare-winrt.ps1
      - name: Configure
        run: cmake -S . -B build/cmake -A x64 -DLGENGINE_BUILD_EXAMPLE=ON -DLGENGINE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/cmake --config Release
      - name: Build and stage pinned LGEngine host
        shell: pwsh
        run: ./integrations/LGEngine/stage-host.ps1 -OutputDirectory build/cmake/Release/lgengine
      - name: Self-test and package
        shell: pwsh
        run: ./package.ps1 -ExecutablePath build/cmake/Release/LiquidGlassControl.exe -IncludeLGEngine
      - name: Create draft with downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object FullName)
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release already exists; preserving reviewed downloads."; exit 0 }
          $prerelease = @()
          if ($env:GITHUB_REF_NAME.Contains('-')) { $prerelease = @('--prerelease') }
          gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --draft @prerelease --title "Liquid Glass Control $env:GITHUB_REF_NAME - Motion Refresh" --notes-file release/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
